<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overall Dashboard · Trading Hub</title>
  <link rel="stylesheet" href="css/styles.css?v=5">
  <style>
    #monthCal { max-width:none; }
    .rcal { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .rcal-wd { font-family:var(--mono); font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--mu); text-align:center; padding-bottom:2px; }
    .rcal-empty { aspect-ratio:25/14; }
    .rcal-day { aspect-ratio:25/14; border:.5px solid var(--b); border-radius:6px; background:var(--card2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:2px; }
    .rcal-day .rcal-date { font-family:var(--mono); font-size:13px; color:var(--mu); }
    .rcal-day .rcal-r { font-family:var(--mono); font-size:13px; font-weight:600; }
    .rcal-day.plus { background:var(--grg); border-color:rgba(52,211,153,.4); }
    .rcal-day.plus .rcal-date, .rcal-day.plus .rcal-r { color:var(--gr); }
    .rcal-day.minus { background:var(--cog); border-color:rgba(248,113,113,.4); }
    .rcal-day.minus .rcal-date, .rcal-day.minus .rcal-r { color:var(--co); }
    .rcal-day.be { background:rgba(139,143,154,.12); border-color:var(--mu); }
    .rcal-day.be .rcal-r { color:var(--tx); }
  </style>
</head>
<body>
  <div class="app">
    <div id="shell"></div>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Overall Dashboard</h1>
          <div class="sub">Everything below is computed live from your logged trades</div>
        </div>
        <div class="row">
          <select id="range" style="width:auto">
            <option value="all">All time</option>
            <option value="ytd">Year to date</option>
            <option value="30">Last 30 days</option>
          </select>
          <a class="btn pri" href="pages/trades.html">+ Log a trade</a>
        </div>
      </div>

      <!-- Headline stat tiles -->
      <div class="grid g4" id="tiles"></div>

      <!-- Equity curve + per-trade R -->
      <div class="grid g2" style="margin-top:14px">
        <div class="card">
          <div class="card-label">Equity Curve — cumulative R</div>
          <div class="chart-box"><canvas id="chartEqR"></canvas></div>
        </div>
        <div class="card">
          <div class="card-label">Every trade — R multiple</div>
          <div class="chart-box"><canvas id="chartTradeR"></canvas></div>
        </div>
      </div>

      <!-- Scatter plot: each trade as a dot (trade # vs P&L in R) -->
      <div class="card" style="margin-top:14px">
        <div class="card-label">Scatter — P&amp;L (R) per trade</div>
        <div class="chart-box"><canvas id="chartScatter"></canvas></div>
      </div>

      <!-- Secondary metrics + rule adherence -->
      <div class="grid g4" id="tiles2" style="margin-top:14px"></div>

      <!-- Current-month daily-result calendar -->
      <div class="card" style="margin-top:14px">
        <div class="card-label" id="monthCalLabel">This month — daily result (R)</div>
        <div id="monthCal"></div>
      </div>

      <!-- Insights -->
      <div class="card" style="margin-top:14px">
        <div class="card-label">Automatic support — what the numbers are telling you</div>
        <div id="insights"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/supabase-client.js?v=3"></script>
  <script src="js/stats.js?v=5"></script>
  <script src="js/shell.js?v=19"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/dashboard.js?v=7"></script>
</body>
</html>
