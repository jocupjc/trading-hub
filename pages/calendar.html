<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar · Trading Hub</title>
  <link rel="stylesheet" href="../css/styles.css?v=4">
</head>
<body>
  <div class="app">
    <div id="shell"></div>
    <main class="main">
      <div class="page-head">
        <div>
          <h1 id="title">Calendar</h1>
          <div class="sub" id="subtitle"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-label" id="card-label">Coming soon</div>
        <div class="empty" id="placeholder">This calendar is a placeholder — its content will be defined later.</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/supabase-client.js?v=6"></script>
  <script src="../js/shell.js?v=13"></script>
  <script src="../js/auth.js?v=3"></script>
  <script>
    const INSTRUMENTS = { NQ: 'NQ', ES: 'ES', CL: 'CL' };
    const TYPES = {
      ddr: { label: 'DDR', name: 'Daily Defining Range' },
      wddrs: { label: 'WDDRS', name: 'Weekly / Daily Defining Range Sequence' },
    };
    const params = new URLSearchParams(location.search);
    const type = TYPES[params.get('type')] ? params.get('type') : 'ddr';
    const inst = INSTRUMENTS[params.get('inst')] ? params.get('inst') : 'NQ';
    const t = TYPES[type];

    Shell.mount(`pages/calendar.html?type=${type}&inst=${inst}`, '../');

    const heading = `${t.label} Calendar · ${inst}`;
    document.getElementById('title').textContent = heading;
    document.getElementById('subtitle').textContent = `${t.name} — ${inst}`;
    document.getElementById('card-label').textContent = `${t.label} · ${inst}`;
    document.getElementById('placeholder').textContent =
      `Placeholder for the ${t.label} (${t.name}) calendar for ${inst}. Content to be defined.`;
    document.title = heading + ' · Trading Hub';
  </script>
</body>
</html>
