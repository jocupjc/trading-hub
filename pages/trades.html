<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trades & PnL · Trading Hub</title>
  <link rel="stylesheet" href="../css/styles.css?v=5">
  <style>
    .pill-green { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--gr); background:var(--grg); border:.5px solid rgba(52,211,153,.3); padding:3px 10px; border-radius:20px; margin:0 0 12px; }
    .sec-head { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
    .sec-head .chev { color:var(--mu); font-size:12px; transition:transform .15s; }
    .jsection.collapsed .chev { transform:rotate(-90deg); }
    .jsection.collapsed .sec-body { display:none; }
    .jsection.collapsed .pill-green { margin-bottom:0; }
    .dr-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .recent-form { display:inline-flex; gap:5px; align-items:center; margin:0 0 12px; }
    .rf-cap { font-size:9.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--mu); margin-right:4px; font-family:var(--mono); }
    .rf-dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:.5px solid rgba(255,255,255,.12); }
    .rf-dot.win { background:var(--gr); }
    .rf-dot.loss { background:var(--co); }
    .rf-dot.be { background:var(--mu); }
  </style>
</head>
<body>
  <div class="app">
    <div id="shell"></div>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Trades &amp; PnL</h1>
          <div class="sub">Log executions — R is auto-computed from entry / stop / exit</div>
        </div>
        <div class="row">
          <button class="btn" id="btnExport">Export CSV</button>
        </div>
      </div>

      <!-- Running totals -->
      <div class="grid g4" id="totals"></div>

      <!-- Entry form -->
      <div class="card" style="margin-top:14px">
        <div class="pill-green">New / edit trade</div>
        <input type="hidden" id="f-id">
        <div class="grid g4" style="gap:12px">
          <label class="field"><span class="fl">Date</span><input type="date" id="f-date"></label>
          <label class="field"><span class="fl">Entry time</span><input type="time" id="f-time"></label>
          <label class="field"><span class="fl">Instrument</span><select id="f-inst"></select></label>
          <label class="field"><span class="fl">Direction</span>
            <select id="f-dir"><option>LONG</option><option>SHORT</option></select></label>

          <label class="field"><span class="fl">Entry price</span><input type="number" step="any" id="f-entry"></label>
          <label class="field"><span class="fl">Stop level</span><input type="number" step="any" id="f-stop"></label>
          <label class="field"><span class="fl">Target</span><input type="number" step="any" id="f-target"></label>
          <label class="field"><span class="fl">Exit price</span><input type="number" step="any" id="f-exit"></label>

          <label class="field"><span class="fl">Contracts</span><input type="number" step="any" id="f-contracts"></label>
          <label class="field"><span class="fl">R result <span id="f-rr-auto" class="mono" style="color:var(--mu)"></span></span><input type="number" step="any" id="f-rr" placeholder="auto"></label>
          <label class="field"><span class="fl">$ PnL (optional)</span><input type="number" step="any" id="f-dollar"></label>
          <label class="field"><span class="fl">Outcome</span>
            <select id="f-outcome"><option value="">auto</option><option value="win">win</option><option value="loss">loss</option><option value="be">break-even</option></select></label>

          <label class="field" style="grid-column:span 2"><span class="fl">Model / setup</span><input type="text" id="f-model" placeholder="e.g. RDR M7B, box reversal…"></label>
          <label class="field" style="grid-column:span 2"><span class="fl">Notes</span><input type="text" id="f-notes"></label>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn pri" id="btnSave">Save trade</button>
          <button class="btn" id="btnClear">Clear</button>
          <div class="spacer"></div>
          <span id="rr-preview" class="mono" style="color:var(--mu)"></span>
        </div>

        <!-- Charts & screenshots for THIS trade -->
        <div id="c-panel" style="margin-top:16px;border-top:.5px solid var(--b);padding-top:14px">
          <div class="card-label">Charts &amp; screenshots for this trade</div>
          <div class="mono" id="c-hint" style="font-size:11px;color:var(--mu)">Save the trade first, then attach its charts &amp; screenshots here.</div>
          <div id="c-controls" style="display:none">
            <div class="grid g4" style="gap:12px">
              <label class="field" style="grid-column:span 2"><span class="fl">Title</span><input type="text" id="c-title" placeholder="e.g. entry screenshot, 5m context…"></label>
              <label class="field"><span class="fl">Kind</span>
                <select id="c-kind"><option value="link">TradingView link</option><option value="screenshot">Screenshot upload</option></select></label>
              <div style="display:flex;align-items:flex-end"><button class="btn pri" id="c-add" style="width:100%">Add</button></div>
              <label class="field" id="c-wrap-url" style="grid-column:span 4"><span class="fl">TradingView URL</span><input type="text" id="c-url" placeholder="https://www.tradingview.com/x/..."></label>
              <label class="field" id="c-wrap-file" style="grid-column:span 4;display:none"><span class="fl">Image file</span><input type="file" id="c-file" accept="image/*"></label>
            </div>
            <div class="mono" id="c-note" style="font-size:10px;color:var(--mu);margin-top:8px"></div>
            <div id="c-wrap" style="margin-top:14px"></div>
          </div>
        </div>
      </div>

      <!-- Daily running overview -->
      <div class="card" style="margin-top:14px">
        <div class="dr-head">
          <span class="pill-green">Daily result &amp; running cumulative (R)</span>
          <span class="recent-form" id="recentForm"></span>
        </div>
        <div style="overflow-x:auto">
          <table class="data" id="dayTable"></table>
        </div>
        <div class="mono" id="dayNote" style="font-size:10px;color:var(--mu);margin-top:8px"></div>
      </div>

      <!-- All trades -->
      <div class="card jsection" style="margin-top:14px">
        <div class="sec-head"><span class="pill-green">All trades</span><span class="chev">▾</span></div>
        <div class="sec-body">
          <div style="overflow-x:auto">
            <table class="data" id="tradeTable"></table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/supabase-client.js?v=6"></script>
  <script src="../js/stats.js?v=5"></script>
  <script src="../js/shell.js?v=18"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/trades.js?v=8"></script>
</body>
</html>
