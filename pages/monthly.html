<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly Statistics · Trading Hub</title>
  <link rel="stylesheet" href="../css/styles.css?v=4">
  <style>
    .mo-controls { display:flex; align-items:center; gap:10px; }
    .mo-toolbtn { font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:8px; border:.5px solid var(--bh); background:var(--card2); color:var(--mu); cursor:pointer; }
    .mo-toolbtn:hover { border-color:var(--ac); color:var(--ac); }
    .mo-card { margin-bottom:16px; }
    .mo-head { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ac); background:var(--acg); border:.5px solid rgba(79,142,247,.3); padding:9px 14px; border-radius:20px; }
    .mo-head:hover { border-color:var(--ac); }
    .mo-title { font-weight:700; }
    .mo-meta { display:flex; align-items:center; gap:12px; }
    .mo-badge { font-family:var(--mono); font-weight:700; }
    .mo-sub { color:var(--mu); font-size:10px; letter-spacing:.5px; }
    .mo-chev { font-size:12px; color:var(--mu); transition:transform .15s; }
    .mo-card.collapsed .mo-chev { transform:rotate(-90deg); }
    .mo-card.collapsed .mo-body { display:none; }
    .mo-body { margin-top:12px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="shell"></div>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Monthly Statistics</h1>
          <div class="sub">Every logged trade, grouped by the month it was taken — with automatic support per month</div>
        </div>
        <div class="mo-controls">
          <button class="mo-toolbtn" id="mo-expand">Expand all</button>
          <button class="mo-toolbtn" id="mo-collapse">Collapse all</button>
        </div>
      </div>

      <div id="mo-root"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/supabase-client.js?v=6"></script>
  <script src="../js/stats.js?v=3"></script>
  <script src="../js/shell.js?v=17"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/monthly.js?v=1"></script>
</body>
</html>
