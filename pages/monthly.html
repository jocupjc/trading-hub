<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly Statistics · Trading Hub</title>
  <link rel="stylesheet" href="../css/styles.css?v=4">
  <style>
    .mo-controls { display:flex; align-items:center; gap:10px; }
    .mo-toolbtn { font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:8px; border:.5px solid var(--bh); background:var(--card2); color:var(--mu); cursor:pointer; }
    .mo-toolbtn:hover { border-color:var(--ac); color:var(--ac); }
    .mo-card { margin-bottom:16px; }
    .mo-head { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ac); background:var(--acg); border:.5px solid rgba(79,142,247,.3); padding:9px 14px; border-radius:20px; }
    .mo-head:hover { border-color:var(--ac); }
    .mo-title { font-weight:700; }
    .mo-meta { display:flex; align-items:center; gap:12px; }
    .mo-badge { font-family:var(--mono); font-weight:700; }
    .mo-sub { color:var(--mu); font-size:10px; letter-spacing:.5px; }
    .mo-chev { font-size:12px; color:var(--mu); transition:transform .15s; }
    .mo-card.collapsed .mo-chev { transform:rotate(-90deg); }
    .mo-card.collapsed .mo-body { display:none; }
    .mo-body { margin-top:12px; }
    .rcal { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
    .rcal-wd { font-family:var(--mono); font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--mu); text-align:center; padding-bottom:2px; }
    .rcal-empty { aspect-ratio:1/1; }
    .rcal-day { aspect-ratio:1/1; border:.5px solid var(--b); border-radius:6px; background:var(--card2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:2px; }
    .rcal-day .rcal-date { font-family:var(--mono); font-size:11px; color:var(--mu); }
    .rcal-day .rcal-r { font-family:var(--mono); font-size:11px; font-weight:600; }
    .rcal-day.plus { background:var(--grg); border-color:rgba(52,211,153,.4); }
    .rcal-day.plus .rcal-date, .rcal-day.plus .rcal-r { color:var(--gr); }
    .rcal-day.minus { background:var(--cog); border-color:rgba(248,113,113,.4); }
    .rcal-day.minus .rcal-date, .rcal-day.minus .rcal-r { color:var(--co); }
    .rcal-day.be { background:rgba(139,143,154,.12); border-color:var(--mu); }
    .rcal-day.be .rcal-r { color:var(--tx); }
  </style>
</head>
<body>
  <div class="app">
    <div id="shell"></div>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Monthly Statistics</h1>
          <div class="sub">Every logged trade, grouped by the month it was taken — with automatic support per month</div>
        </div>
        <div class="mo-controls">
          <button class="mo-toolbtn" id="mo-expand">Expand all</button>
          <button class="mo-toolbtn" id="mo-collapse">Collapse all</button>
        </div>
      </div>

      <div id="mo-root"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../js/config.js?v=3"></script>
  <script src="../js/supabase-client.js?v=6"></script>
  <script src="../js/stats.js?v=4"></script>
  <script src="../js/shell.js?v=18"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/monthly.js?v=2"></script>
</body>
</html>
