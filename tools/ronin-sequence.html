<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence Journal</title>
<style>
  :root{
    --bg: #14161b;
    --panel: #1b1e25;
    --panel-2: #21242c;
    --line: #2c303a;
    --text: #e7e5e0;
    --muted: #8b8f9a;
    --muted-2: #5d6170;
    --amber: #d2a44d;
    --amber-dim: #9c7c3f;
    --green: #6fae7e;
    --red: #c1685f;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
  }
  ::selection{background:var(--amber-dim); color:#fff;}
  .app{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    background:var(--panel); border-right:1px solid var(--line);
    padding:18px 16px; display:flex; flex-direction:column; gap:22px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .mark{font-family:var(--serif); font-size:19px; letter-spacing:.2px;}
  .brand .sub{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1.2px;}

  .navbtns{display:flex; gap:6px;}
  .navbtns button{flex:1;}

  .datepicker{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:6px; font-family:var(--mono); font-size:13px; width:100%;
  }
  button{
    cursor:pointer; font-family:var(--sans); border-radius:6px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); padding:7px 11px; font-size:12.5px;
    transition:border-color .15s, color .15s;
  }
  button:hover{border-color:var(--amber-dim); color:var(--amber);}
  button.primary{background:var(--amber); border-color:var(--amber); color:#1a1306; font-weight:600;}
  button.primary:hover{background:#e0b461; color:#1a1306;}
  button.ghost{background:transparent;}
  button.danger:hover{border-color:var(--red); color:var(--red);}
  button.small{padding:4px 8px; font-size:11px;}

  .navmode{display:flex; flex-direction:column; gap:4px;}
  .navmode button{justify-content:flex-start; text-align:left;}
  .navmode button.active{border-color:var(--amber); color:var(--amber); background:var(--panel-2);}

  .taglist{display:flex; flex-direction:column; gap:5px; overflow-y:auto; max-height:320px;}
  .taglist .label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-2); margin-bottom:2px;}
  .tagchip{
    display:flex; justify-content:space-between; align-items:center;
    padding:5px 9px; border-radius:5px; font-size:12px; cursor:pointer;
    border:1px solid transparent; color:var(--muted);
  }
  .tagchip:hover{background:var(--panel-2); color:var(--text);}
  .tagchip.active{background:rgba(210,164,77,.12); border-color:var(--amber-dim); color:var(--amber);}
  .tagchip .cnt{font-family:var(--mono); color:var(--muted-2); font-size:10.5px;}

  .entrylist{display:flex; flex-direction:column; gap:2px; overflow-y:auto; flex:1;}
  .entrylist .label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-2); margin-bottom:4px;}
  .entryitem{
    padding:6px 9px; border-radius:5px; font-size:12.5px; cursor:pointer; color:var(--muted);
    display:flex; justify-content:space-between;
  }
  .entryitem:hover{background:var(--panel-2); color:var(--text);}
  .entryitem.active{background:rgba(210,164,77,.1); color:var(--amber);}
  .entry-r-group{display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:8px;}
  .entry-r{font-family:var(--mono); font-size:13px;}
  .entry-r.r-pos{color:var(--green);}
  .entry-r.r-neg{color:var(--red);}
  .entry-r-running{font-family:var(--mono); font-size:11.5px; opacity:0.7;}
  .entry-r-running.r-pos{color:var(--green);}
  .entry-r-running.r-neg{color:var(--red);}

  .savestate{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); text-align:center; padding-top:4px; border-top:1px solid var(--line);}
  .savestate.saved{color:var(--green);}
  .savestate.error{color:var(--red);}

  /* MAIN */
  .main{padding:30px 40px 80px; max-width:920px; margin:0 auto; width:100%;}
  .daytitle{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .daytitle h1{font-family:var(--serif); font-weight:500; font-size:28px; margin:0;}
  .daytitle .dow{font-family:var(--mono); color:var(--muted); font-size:13px;}
  .daysub{color:var(--muted); font-size:13px; margin-bottom:28px;}
  .daysub input{
    background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--muted);
    font-family:var(--sans); font-size:13px; padding:2px 0; width:100%; max-width:500px;
  }
  .daysub input:focus{outline:none; border-bottom-color:var(--amber-dim); color:var(--text);}

  .section{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    margin-bottom:16px; overflow:hidden;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; cursor:pointer; user-select:none;
  }
  .section-head h2{font-family:var(--serif); font-size:17px; font-weight:500; margin:0; display:flex; align-items:center; gap:10px;}
  .section-head .chev{color:var(--muted-2); font-size:11px; transition:transform .15s;}
  .section.collapsed .chev{transform:rotate(-90deg);}
  .section.collapsed .section-body{display:none;}
  .section-head .meta{display:flex; gap:6px; align-items:center;}
  .pillcount{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); background:var(--panel-2); padding:2px 7px; border-radius:20px;}

  .section-body{padding:0 18px 18px;}
  .field-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.1px; color:var(--muted-2); margin:14px 0 6px;}
  textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.55; padding:11px 13px;
    resize:none; min-height:64px; overflow:hidden;
  }
  textarea:focus{outline:none; border-color:var(--amber-dim);}
  textarea.review{border-left:3px solid var(--green);}

  .reviewtoggle{font-family:var(--mono); font-size:11px; color:var(--muted-2); background:none; border:none; cursor:pointer; padding:0; margin-top:10px;}
  .reviewtoggle:hover{color:var(--green);}
  .reviewblock{margin-top:8px;}

  .tagrow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px;}
  .tag{
    font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:20px;
    background:rgba(210,164,77,.1); border:1px solid var(--amber-dim); color:var(--amber);
    display:flex; align-items:center; gap:6px;
  }
  .tag .x{cursor:pointer; color:var(--muted); font-weight:bold;}
  .tag .x:hover{color:var(--red);}
  .tagadd{position:relative;}
  .tagadd input{
    background:var(--panel-2); border:1px dashed var(--line); border-radius:20px;
    color:var(--text); font-family:var(--mono); font-size:11px; padding:3px 10px; width:130px;
  }
  .tagadd input:focus{outline:none; border-color:var(--amber-dim); border-style:solid;}
  .tagsuggest{
    position:absolute; top:26px; left:0; background:var(--panel-2); border:1px solid var(--line);
    border-radius:7px; z-index:20; min-width:160px; max-height:180px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .tagsuggest div{padding:6px 10px; font-family:var(--mono); font-size:11.5px; cursor:pointer; color:var(--muted);}
  .tagsuggest div:hover{background:var(--panel); color:var(--amber);}


  .linkgrid{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
  .linkcard{
    display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:6px;
    background:var(--panel-2); border:1px solid var(--line); font-size:12px;
  }
  .linkcard .tv-icon{font-size:14px; flex-shrink:0;}
  .linkcard-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .linkcard-tag{
    background:none; border:none; color:var(--amber); font-family:var(--sans); font-size:12px;
    font-weight:600; padding:0; width:100%;
  }
  .linkcard-tag:focus{outline:none;}
  .linkcard-tag::placeholder{color:var(--muted-2); font-weight:400; font-style:italic;}
  .linkcard a{color:var(--muted); text-decoration:none; font-family:var(--mono); font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
  .linkcard a:hover{text-decoration:underline; color:var(--amber);}
  .linkcard .rm{background:none; border:none; color:var(--muted-2); cursor:pointer; padding:0; font-size:14px; line-height:1; flex-shrink:0;}
  .linkcard .rm:hover{color:var(--red);}
  .linkinput-row{display:flex; gap:6px; margin-top:10px; align-items:center;}
  .linkinput-row input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:11.5px; padding:7px 10px;
  }
  .linkinput-row input:focus{outline:none; border-color:var(--amber-dim);}
  .linkinput-row input::placeholder{color:var(--muted-2);}
  .linkinput-row button{padding:7px 10px; font-size:12px;}
  .scoreinput{
    width:64px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:14px; padding:7px 10px; text-align:center;
  }
  .scoreinput:focus{outline:none; border-color:var(--amber-dim);}

  .tradecard{border:1px solid var(--line); border-radius:8px; padding:14px; margin-top:12px; background:var(--panel-2);}
  .tradecard-top{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .tradecard-top input, .tradecard-top select{
    background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px;
    padding:6px 9px; font-family:var(--mono); font-size:12px;
  }
  .tradecard-top .w-time{width:90px;} .tradecard-top .w-dir{width:90px;} .tradecard-top .w-r{width:90px;} .tradecard-top .w-model{width:160px;}
  .trade-remove{margin-left:auto;}

  .addbtn{margin-top:8px;}

  .m7retrace-row{display:flex; gap:8px; margin-bottom:4px;}
  .m7retrace-btn{padding:6px 18px; font-family:var(--mono); font-size:12px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); cursor:pointer; transition:all .15s;}
  .m7retrace-btn:hover{border-color:var(--amber-dim); color:var(--amber);}
  .m7retrace-btn.active{background:rgba(210,164,77,.15); border-color:var(--amber); color:var(--amber); font-weight:600;}

  /* RED FLAGS */
  .redflag-block{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:16px;
  }
  .redflag-title{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--red); display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; row-gap:6px;
  }
  .rf-icon{font-size:13px;}
  .rf-count{
    background:rgba(139,143,154,.14); border:1px solid var(--muted-2); color:var(--muted);
    border-radius:20px; padding:1px 8px; font-size:10px;
  }
  .rf-count-yellow{
    background:rgba(230,196,60,.15); border:1px solid #e6c43c; color:#e6c43c;
  }
  .rf-count-gray{
    background:rgba(139,143,154,.14); border:1px solid var(--muted-2); color:var(--muted);
  }
  .redflag-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:6px 12px;
  }
  .rf-item{
    display:flex; align-items:center; gap:8px; cursor:pointer; padding:5px 8px;
    border-radius:6px; border:1px solid transparent; user-select:none;
    transition:background .12s, border-color .12s;
  }
  .rf-item:hover{background:var(--panel-2);}
  .rf-item input[type=checkbox]{display:none;}
  .rf-box{
    width:16px; height:16px; border-radius:4px; border:1.5px solid var(--muted-2);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; color:transparent; flex-shrink:0;
    transition:all .12s;
  }
  .rf-item.checked .rf-box{background:var(--red); border-color:var(--red); color:#fff;}
  .rf-item.checked{border-color:rgba(193,104,95,.25); background:rgba(193,104,95,.07);}
  .rf-item.checked-yellow .rf-box{background:#e6c43c; border-color:#e6c43c; color:#1a1608;}
  .rf-item.checked-yellow{border-color:rgba(230,196,60,.3); background:rgba(230,196,60,.09);}
  .rf-item.checked-green .rf-box{background:var(--green); border-color:var(--green); color:#fff;}
  .rf-item.checked-green{border-color:rgba(111,174,126,.3); background:rgba(111,174,126,.09);}
  .rf-item.checked-info .rf-box{background:#6ea8e0; border-color:#6ea8e0; color:#0d1520;}
  .rf-item.checked-info{border-color:rgba(110,168,224,.3); background:rgba(110,168,224,.09);}
  .rf-item.checked-orange .rf-box{background:#e07b39; border-color:#e07b39; color:#1a0f08;}
  .rf-item.checked-orange{border-color:rgba(224,123,57,.3); background:rgba(224,123,57,.09);}
  .rf-item.checked-gray .rf-box{background:var(--muted-2); border-color:var(--muted-2); color:#fff;}
  .rf-item.checked-gray{border-color:rgba(139,143,154,.3); background:rgba(139,143,154,.09);}
  .rf-label{font-size:13px; color:var(--muted);}
  .rf-item.checked .rf-label, .rf-item.checked-yellow .rf-label,
  .rf-item.checked-green .rf-label, .rf-item.checked-info .rf-label,
  .rf-item.checked-orange .rf-label, .rf-item.checked-gray .rf-label{color:var(--text);}
  .rf-signal-group{
    margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .rf-signal-label{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted-2); margin-bottom:8px;
  }
  .rf-signal-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .rf-badge{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:3px 10px; border-radius:20px; display:inline-block;
  }
  .rf-badge-green{color:#0f1a14; background:var(--green);}
  .rf-badge-red{color:#1a0f0f; background:var(--red);}
  .rf-badge-yellow{color:#1a1608; background:#e6c43c;}
  .rf-badge-info{color:#0d1520; background:#6ea8e0;}
  .rf-badge-orange{color:#1a0f08; background:#e07b39;}
  .rf-subgroup-label{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted-2); margin:14px 0 8px; padding-top:12px; border-top:1px solid var(--line);
  }
  .redflag-title + .rf-subgroup-label:first-of-type{margin-top:0;}

  /* CHECKLISTS */
  .cl-block{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px;}
  .cl-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .cl-title{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--amber); margin-bottom:2px;}
  .cl-sub{font-size:11px; color:var(--muted-2);}
  .cl-summary{display:flex; gap:6px; align-items:center; font-family:var(--mono); font-size:12px;}
  .cl-u-count{color:var(--green); background:rgba(111,174,126,.12); border:1px solid rgba(111,174,126,.3); padding:2px 8px; border-radius:20px;}
  .cl-d-count{color:var(--red); background:rgba(193,104,95,.12); border:1px solid rgba(193,104,95,.3); padding:2px 8px; border-radius:20px;}
  .cl-n-count{color:var(--muted); background:rgba(139,143,154,.1); border:1px solid rgba(139,143,154,.3); padding:2px 8px; border-radius:20px;}
  .cl-chk-count{color:var(--muted); background:rgba(139,143,154,.14); border:1px solid var(--muted-2); padding:2px 8px; border-radius:20px;}
  .cl-bias{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:3px 10px; border-radius:20px; margin-right:2px;
  }
  .cl-bias-U{color:#0f1a14; background:var(--green); box-shadow:0 0 0 1px var(--green), 0 0 10px rgba(111,174,126,.5);}
  .cl-bias-D{color:#1a0f0f; background:var(--red); box-shadow:0 0 0 1px var(--red), 0 0 10px rgba(193,104,95,.5);}
  .cl-u-count.cl-winning{color:#fff; background:var(--green); border-color:var(--green); font-weight:700;}
  .cl-d-count.cl-winning{color:#fff; background:var(--red); border-color:var(--red); font-weight:700;}
  .cl-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:5px;}
  .cl-grid + .cl-subgroup-label{margin-top:16px;}
  .cl-subgroup-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-2); margin-bottom:6px; border-top:1px solid var(--line); padding-top:12px;}
  .cl-head + .cl-subgroup-label{border-top:none; padding-top:0;}
  .cl-item{
    display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel-2); cursor:pointer;
    user-select:none; transition:all .12s;
  }
  .cl-item:hover{border-color:var(--muted-2);}
  .cl-item.U{background:rgba(111,174,126,.1); border-color:rgba(111,174,126,.4);}
  .cl-item.D{background:rgba(193,104,95,.1); border-color:rgba(193,104,95,.4);}
  .cl-item.N{background:rgba(139,143,154,.08); border-color:rgba(139,143,154,.3);}
  .cl-item.E{background:rgba(111,174,126,.1); border-color:rgba(111,174,126,.4);}
  .cl-item.C{background:rgba(193,104,95,.1); border-color:rgba(193,104,95,.4);}
  .cl-item.CHK{background:rgba(139,143,154,.14); border-color:var(--muted-2);}
  .cl-item.CHKY{background:rgba(230,196,60,.16); border-color:#e6c43c;}
  .cl-badge{
    font-family:var(--mono); font-size:11px; font-weight:700; width:18px; height:18px;
    border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--panel); border:1px solid var(--line); color:var(--muted-2);
  }
  .cl-item.U .cl-badge{background:var(--green); border-color:var(--green); color:#fff;}
  .cl-item.D .cl-badge{background:var(--red); border-color:var(--red); color:#fff;}
  .cl-item.N .cl-badge{background:var(--muted-2); border-color:var(--muted-2); color:#fff;}
  .cl-item.E .cl-badge{background:var(--green); border-color:var(--green); color:#fff;}
  .cl-item.C .cl-badge{background:var(--red); border-color:var(--red); color:#fff;}
  .cl-item.CHK .cl-badge{background:var(--muted-2); border-color:var(--muted-2); color:#fff;}
  .cl-item.CHKY .cl-badge{background:#e6c43c; border-color:#e6c43c; color:#1a1608;}
  .cl-item-label{font-size:12.5px; color:var(--muted);}
  .cl-item.U .cl-item-label, .cl-item.D .cl-item-label,
  .cl-item.N .cl-item-label, .cl-item.E .cl-item-label, .cl-item.C .cl-item-label,
  .cl-item.CHK .cl-item-label, .cl-item.CHKY .cl-item-label{color:var(--text);}
  .cl-item-wrap{display:flex; flex-direction:column; gap:4px;}
  .rf-item-wrap{display:flex; flex-direction:column; gap:2px;}
  .cl-model-input{
    font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:5px;
    background:var(--panel); border:1px dashed var(--line); color:var(--amber);
    width:100%;
  }
  .cl-model-input:focus{outline:none; border-style:solid; border-color:var(--amber-dim);}
  .cl-model-input::placeholder{color:var(--muted-2);}

  /* KEY CANDLES */
  .candle-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; margin-top:4px;}
  .candlecard{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px;}
  .candlecard-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--amber); margin-bottom:10px;}
  .candlecard-fields{display:flex; gap:8px; margin-bottom:10px; align-items:center;}
  .candlecard-fields input[type=text]{

  .searchresult{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:12px; cursor:pointer;}
  .searchresult:hover{border-color:var(--amber-dim);}
  .searchresult .sr-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--muted-2); margin-bottom:6px;}

<script>
/* ---------------- localStorage shim for window.storage (Trading Hub) ---------------- */
if(!window.storage){
  window.storage = {
    async get(key){ try{ const v = localStorage.getItem('ronin:'+key); return v!==null ? {value:v} : null; }catch(e){ return null; } },
    async set(key, value){ try{ localStorage.setItem('ronin:'+key, value); return true; }catch(e){ return false; } },
    async delete(key){ try{ localStorage.removeItem('ronin:'+key); }catch(e){} },
    async list(prefix){ const keys=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('ronin:'+ (prefix||''))) keys.push(k.slice(6)); } }catch(e){} return {keys}; },
  };
}
/* ---------------- storage helpers ---------------- */
async function sGet(key, shared=false){ try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }catch(e){ return null; } }
async function sSet(key, value, shared=false){ try{ await window.storage.set(key, value, shared); return true; }catch(e){ console.error('storage set failed', e); return false; } }
async function sDel(key, shared=false){ try{ await window.storage.delete(key, shared); }catch(e){} }
async function sList(prefix, shared=false){ try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }catch(e){ return []; } }

function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------------- section schema ---------------- */
const SECTION_DEFS = [
  {key:'preMarket', label:'Pre-Market Thoughts'},
  {key:'open', label:'Box Formation Thoughts'},
  {key:'boxReversal', label:'Box Reversal Thoughts'},
  {key:'rbc', label:'RBC Thoughts'},
  {key:'m7x', label:'M7X Thoughts'},
  {key:'eod', label:'End of Day Analysis'}
];

// checkboxes shown at the bottom of End of Day Analysis in place of the generic tag row
const EOD_DB_UPDATE_DEFS = [
  {key:'redFlag',    label:'Update Red Flag Database'},
  {key:'ltf',        label:'Update LTF Database'},
  {key:'confluence', label:'Update Confluence Database'},
  {key:'model',      label:'Update Model Database'},
  {key:'ote',        label:'Update OTE Data'},
];

const CANDLE_DEFS = [
  {key:'drLow',         label:'DR Low'},
  {key:'drHigh',        label:'DR High'},
  {key:'m7Retracement', label:'M7 Retracement'},
  {key:'maxRetracement',label:'Max Retracement'},
  {key:'maxExtension',  label:'Max Extension'},
];

const RED_FLAG_DEFS = [
  {key:'news',              label:'News'},
  {key:'insideWdr',         label:'Inside WDR'},
  {key:'weeklyRcModel',     label:'Weekly Rc Model'},
  {key:'noWdrrbBreakout',   label:'No WDRRB Breakout'},
  {key:'yesterdayInsideDay',label:'Yesterday was Inside Day'},
  {key:'wdrrbFalseDay',     label:'WDRRB False Day'},
  {key:'brokenAdr',         label:'Broken ADR'},
  {key:'adrCombDdrMin',     label:'ODR in Comb. Min/Min'},
  {key:'adrSpanningWdrrbMid',label:'ADR spanning WDRRB mid'},
  {key:'adrHalfDisagree',   label:'ADR & 0.5 Disagree'},
  {key:'tripleFalseOdr',    label:'Triple False ODR'},
  {key:'rcModel',           label:'Rc Model'},
  {key:'rxModel',           label:'Rx Model'},
  {key:'wdrrbQ37',          label:'WDRRB Q-3/7+'},
  {key:'multiFalseDay',     label:'Multi-False Day'},
  {key:'turnaroundThursday',label:'Turnaround Thursday'},
];
// red flags that are cautionary (yellow) rather than a hard red flag — grouped
// together visually within the same Red Flags block, under "Amplifiers".
const YELLOW_FLAG_FIELDS = new Set(['tripleFalseOdr','insideWdr','weeklyRcModel','news','wdrrbFalseDay','adrHalfDisagree']);
// red flags that get a tag-chip input underneath them (same shared tag list/autocomplete as sections)
const RED_FLAG_TAG_FIELDS = new Set(['news']);
// Rc/Rx Model — the primary day-model signal. Rc = green light, Rx = red light,
// both checked = caution. Rendered as its own group at the top of Red Flags.
const MODEL_SIGNAL_FIELDS = ['rcModel','rxModel'];
// Yesterday was Inside Day — checked predicts a likely outside/trend day. Its own group.
const OUTSIDE_DAY_FIELDS = ['yesterdayInsideDay'];
// WDRRB Q-3/7+ and Turnaround Thursday — checked predicts a likely reversal. Its own group.
const REVERSAL_FIELDS = ['wdrrbQ37','turnaroundThursday'];
// every key belonging to one of the three special groups above, so the generic
// "Amplifiers" bucket can exclude them.
const SPECIAL_FLAG_FIELDS = new Set([...MODEL_SIGNAL_FIELDS, ...OUTSIDE_DAY_FIELDS, ...REVERSAL_FIELDS]);

const BOX_CHECKLIST_DEFS = [
  {key:'monthly',       label:'Monthly Seq'},
  {key:'weekly',        label:'Weekly Seq'},
  {key:'daily',         label:'Daily Seq'},
  {key:'rdr',           label:'RDR Seq'},
  {key:'dailyModel',    label:'Daily Model'},
  {key:'partials',      label:'Partials'},
  {key:'ddrComSym',     label:'DDR Com. Sym'},
  {key:'ddrSepMinMin',  label:'DDR Sep. min/min'},
  {key:'gaps',          label:'GAPs'},
  {key:'ass',           label:'Market Structure'},
  {key:'vwap',          label:'VWAP'},
  {key:'svpHtf',        label:'SVP HTF'},
  // check-only fields, grouped together at the end
  {key:'markTime',      label:'Mark Time'},
  {key:'svpLtf',        label:'SVP LTF'},
  {key:'vibsH1m30',     label:'Magnetic VIBs'},
  {key:'confluencesCheck',   label:'Confluences'},
  {key:'rdrModel',           label:'RDR Model'},
  {key:'markMakeOrBreak',    label:'Mark Make or Break'},
  {key:'checkDdr',           label:'Check DDR'},
  {key:'markTargets',   label:'Mark Targets'},
  {key:'transitionHL',  label:'Transition H/L'},
  {key:'wdrrbOpen',     label:'WDRRB Open'},
  {key:'chaining',      label:'Chaining'},
];

const POST1030_CHECKLIST_DEFS = [
  {key:'rdrSeq',          label:'RDR SEQ'},
  {key:'adrcs',           label:'ADRCs'},
  {key:'ddrSepWModel',    label:'DDR Sep. w/model'},
  {key:'rdrM7b',          label:'RDR M7B'},
];

// checklist items that also get a model-tag text input
const MODEL_TAG_FIELDS = new Set(['weekly','dailyModel','rdrModel']);
// checklist items that get a link input — none, per revised design
const CHECKLIST_LINK_FIELDS = new Set();
// checklist items that get a tag-chip input underneath them (uses the same shared tag list/autocomplete as sections)
const CHECKLIST_TAG_FIELDS = new Set();
// checklist items that are simple checkboxes (checked/unchecked) instead of U/D/N cycling
const CHECK_ONLY_FIELDS = new Set(['adrcs','wdrrbOpen','vibsH1m30','svpLtf','chaining','markTime','transitionHL','ddrSepWModel','confluencesCheck','rdrM7b','rdrModel','markMakeOrBreak','checkDdr','markTargets']);
// check-only items that get a yellow highlight instead of the standard grey when checked
const HIGHLIGHT_YELLOW_FIELDS = new Set(['adrcs','rdrM7b','transitionHL']);
// checklist items excluded from the U/D summary count at the top of the block
// (ODRS Endpoint cycles E/C/N — Expansion/Contraction — which isn't a directional up/down call)
const EXCLUDE_FROM_UD_COUNT = new Set([]);

function blankSection(){ return {live:'', review:'', reviewOpen:false, tags:[], links:[], collapsed:true, m7BoxRetrace:'', confluenceLink:'', selfScore:'', reEngineeringScore:'', dbUpdates:{redFlag:false, ltf:false, confluence:false, model:false}}; }
function blankCandle(){ return {time:'', tag:'', links:[]}; }
function blankTrade(){ return {id:uid(), time:'', dir:'LONG', model:'', r:'', live:'', review:'', reviewOpen:false, tags:[], links:[]}; }
function blankEntry(date){
  const sections = {};
  SECTION_DEFS.forEach(s => sections[s.key] = blankSection());
  const candles = {};
  CANDLE_DEFS.forEach(c => candles[c.key] = blankCandle());
  const redFlags = {};
  RED_FLAG_DEFS.forEach(f => redFlags[f.key] = false);
  const redFlagTags = {};
  RED_FLAG_TAG_FIELDS.forEach(k => redFlagTags[k] = []);
  const boxChecklist = {};
  BOX_CHECKLIST_DEFS.forEach(f => boxChecklist[f.key] = '');
  const boxChecklistModels = {};
  MODEL_TAG_FIELDS.forEach(k => boxChecklistModels[k] = '');
  const boxChecklistLinks = {};
  CHECKLIST_LINK_FIELDS.forEach(k => boxChecklistLinks[k] = []);
  const boxChecklistTags = {};
  CHECKLIST_TAG_FIELDS.forEach(k => boxChecklistTags[k] = []);
  const post1030Checklist = {};
  POST1030_CHECKLIST_DEFS.forEach(f => post1030Checklist[f.key] = '');
  return {date, dayNote:'', sections, trades:[], candles, redFlags, redFlagTags, boxChecklist, boxChecklistModels, boxChecklistLinks, boxChecklistTags, post1030Checklist, tradesCollapsed:true, candlesCollapsed:true};
}

/* ---------------- app state ---------------- */
let currentDate = new Date().toISOString().slice(0,10);
let currentEntry = null;
let allTags = [];
let entryDateIndex = []; // dates known to have entries
let entryRCache = {}; // date -> total R for that day (undefined = not fetched yet, null = no data)
let runningRCache = {}; // date -> cumulative R through that date, in chronological order

function computeTotalR(trades){
  return (trades||[]).reduce((sum,t)=>{ const v = parseFloat(t.r); return sum + (isNaN(v)?0:v); }, 0);
}

function rebuildRunningRCache(){
  const chronological = [...entryDateIndex].sort(); // ascending
  let running = 0;
  runningRCache = {};
  for(const d of chronological){
    const r = entryRCache[d];
    running += (typeof r === 'number' ? r : 0);
    runningRCache[d] = running;
  }
}

async function ensureAllRCached(){
  const uncached = entryDateIndex.filter(d => entryRCache[d] === undefined);
  if(uncached.length) await loadRCacheForDates(uncached);
  rebuildRunningRCache();
}

let saveTimer = null;

// Grows a textarea to fit its content instead of scrolling internally.
function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function fmtDow(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('en-US', {weekday:'long'});
}
function fmtPretty(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

/* ---------------- load / save ---------------- */
async function loadEntry(date){
  const raw = await sGet('entry:'+date);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      SECTION_DEFS.forEach(s=>{
        if(!parsed.sections[s.key]) parsed.sections[s.key] = blankSection();
        const sec = parsed.sections[s.key];
        if(sec.m7BoxRetrace===undefined) sec.m7BoxRetrace='';
        if(!sec.links) sec.links=[];
        if(sec.confluenceLink===undefined) sec.confluenceLink='';
        if(sec.selfScore===undefined) sec.selfScore='';
        if(sec.reEngineeringScore===undefined) sec.reEngineeringScore='';
        if(!sec.dbUpdates) sec.dbUpdates={};
        EOD_DB_UPDATE_DEFS.forEach(f=>{ if(sec.dbUpdates[f.key]===undefined) sec.dbUpdates[f.key]=false; });
      });
      if(!parsed.trades) parsed.trades = [];
      parsed.trades.forEach(t=>{ if(t.reviewOpen===undefined) t.reviewOpen=false; if(!t.links) t.links=[]; if(!t.tags) t.tags=[]; });
      if(!parsed.candles) parsed.candles = {};
      CANDLE_DEFS.forEach(c=>{ if(!parsed.candles[c.key]) parsed.candles[c.key] = blankCandle(); else if(!parsed.candles[c.key].links) parsed.candles[c.key].links=[]; });
      if(!parsed.redFlags) parsed.redFlags = {};
      // one-time migration: Turnaround Thursday moved from Red Flags to the
      // pre-market Checks group — carry over any previously-flagged value.
      if(!parsed.boxChecklist) parsed.boxChecklist = {};
      if(!parsed.post1030Checklist) parsed.post1030Checklist = {};
      if(parsed.redFlags.turnaroundThursday === true && !parsed.boxChecklist.turnaroundThursday){
        parsed.boxChecklist.turnaroundThursday = 'X';
      }
      delete parsed.redFlags.turnaroundThursday;
      // one-time migration: Turnaround Thursday moved BACK from the pre-market checklist
      // into Red Flags, this time under the Reversal Signal group.
      if(parsed.boxChecklist.turnaroundThursday === 'X'){
        parsed.redFlags.turnaroundThursday = true;
      }
      delete parsed.boxChecklist.turnaroundThursday;
      // one-time migration: Days Chained removed from the pre-market checklist entirely
      delete parsed.boxChecklist.daysChained;
      // one-time migration: ODRS Endpoint removed from the pre-market checklist entirely
      delete parsed.boxChecklist.odrsEndpoint;
      if(parsed.boxChecklistTags) delete parsed.boxChecklistTags.daysChained;
      // one-time migration: ADRCs moved from the pre-market checklist to After 1030
      if(parsed.boxChecklist.adrcs === 'X' && !parsed.post1030Checklist.adrcs){
        parsed.post1030Checklist.adrcs = 'X';
      }
      delete parsed.boxChecklist.adrcs;
      // one-time migration: SVP split into SVP LTF / SVP HTF — seed both from the old single value
      if(parsed.boxChecklist.svp === 'X'){
        if(!parsed.boxChecklist.svpLtf) parsed.boxChecklist.svpLtf = 'X';
        if(!parsed.boxChecklist.svpHtf) parsed.boxChecklist.svpHtf = 'X';
      }
      delete parsed.boxChecklist.svp;
      // one-time migration: SVP HTF moved from Checks (checkbox) to Directional (U/D/N) —
      // an old checked value doesn't map to a direction, so just clear it and let it be reset live.
      if(parsed.boxChecklist.svpHtf === 'X'){ parsed.boxChecklist.svpHtf = ''; }
      RED_FLAG_DEFS.forEach(f=>{ if(parsed.redFlags[f.key]===undefined) parsed.redFlags[f.key]=false; });
      if(!parsed.redFlagTags) parsed.redFlagTags = {};
      RED_FLAG_TAG_FIELDS.forEach(k=>{ if(!parsed.redFlagTags[k]) parsed.redFlagTags[k]=[]; });
      BOX_CHECKLIST_DEFS.forEach(f=>{ if(!parsed.boxChecklist[f.key]) parsed.boxChecklist[f.key]=''; });
      if(!parsed.boxChecklistModels) parsed.boxChecklistModels = {};
      // one-time migration: the model-tag input moved from RDR Seq to the RDR Model checkbox
      if(parsed.boxChecklistModels.rdr && !parsed.boxChecklistModels.rdrModel){
        parsed.boxChecklistModels.rdrModel = parsed.boxChecklistModels.rdr;
      }
      delete parsed.boxChecklistModels.rdr;
      MODEL_TAG_FIELDS.forEach(k=>{ if(!parsed.boxChecklistModels[k]) parsed.boxChecklistModels[k]=''; });
      if(!parsed.boxChecklistLinks) parsed.boxChecklistLinks = {};
      CHECKLIST_LINK_FIELDS.forEach(k=>{ if(!parsed.boxChecklistLinks[k]) parsed.boxChecklistLinks[k]=[]; });
      if(!parsed.boxChecklistTags) parsed.boxChecklistTags = {};
      CHECKLIST_TAG_FIELDS.forEach(k=>{ if(!parsed.boxChecklistTags[k]) parsed.boxChecklistTags[k]=[]; });
      POST1030_CHECKLIST_DEFS.forEach(f=>{ if(!parsed.post1030Checklist[f.key]) parsed.post1030Checklist[f.key]=''; });
      // Always start every day fully collapsed — cleaner to open just what you want to look at
      // rather than re-showing whatever happened to be open/closed last time.
      SECTION_DEFS.forEach(s=>{ parsed.sections[s.key].collapsed = true; });
      parsed.tradesCollapsed = true;
      parsed.candlesCollapsed = true;
      return parsed;
    }catch(e){ return blankEntry(date); }
  }
  return blankEntry(date);
}

function setSaveState(state){
  const el = document.getElementById('saveState');
  el.classList.remove('saved','error');
  if(state==='saving'){ el.textContent='saving…'; }
  else if(state==='saved'){ el.textContent='saved ✓'; el.classList.add('saved'); }
  else if(state==='error'){ el.textContent='save failed — retrying…'; el.classList.add('error'); }
  else { el.textContent = '—'; }
}

let retryTimer = null;

function scheduleSave(){
  setSaveState('saving');
  clearTimeout(saveTimer);
  clearTimeout(retryTimer);
  saveTimer = setTimeout(()=> performSave(), 450);
}

async function performSave(){
  const dateAtSaveTime = currentEntry.date;
  const snapshot = JSON.stringify(currentEntry);
  const ok = await sSetSafe('entry:'+dateAtSaveTime, snapshot);
  // If the user has since navigated to a different day, that day's own save
  // cycle owns the UI state now — don't stomp on it.
  if(dateAtSaveTime !== currentEntry.date) return;
  if(ok){
    if(!entryDateIndex.includes(dateAtSaveTime)){ entryDateIndex.push(dateAtSaveTime); entryDateIndex.sort().reverse(); }
    const newR = computeTotalR(currentEntry.trades);
    if(entryRCache[dateAtSaveTime] !== newR){ entryRCache[dateAtSaveTime] = newR; rebuildRunningRCache(); renderEntryList(); }
    setSaveState('saved');
  } else {
    // sSetSafe already retried several times with backoff and failed — the storage
    // backend is having a rough moment. Nothing is lost (currentEntry still holds
    // everything in memory), so quietly keep trying in the background rather than
    // just dumping an error and giving up.
    setSaveState('error');
    retryTimer = setTimeout(()=> performSave(), 4000);
  }
}

/* ---------------- tags master list ---------------- */
async function loadTags(){
  const raw = await sGet('tags:master');
  allTags = raw ? JSON.parse(raw) : [];
}
async function saveTags(){ await sSet('tags:master', JSON.stringify(allTags)); }
async function ensureTag(t){
  t = t.trim();
  if(!t) return null;
  if(!allTags.includes(t)){ allTags.push(t); allTags.sort(); await saveTags(); renderTagList(); }
  return t;
}

/* ---------------- link handling ---------------- */
function tvShortUrl(url){
  try{ return decodeURIComponent(url).replace('https://www.tradingview.com/x/','TV/').replace('https://www.tradingview.com/','TV/'); }
  catch(e){ return url; }
}
function normLink(item){
  if(typeof item === 'string') return {url:item, tag:''};
  return {url:item.url||'', tag:item.tag||''};
}
function linkGridHTML(links, kind, key){
  if(!links||!links.length) return '';
  return `<div class="linkgrid">${links.map((raw,idx)=>{
    const link = normLink(raw);
    return `<div class="linkcard">
      <span class="tv-icon">📈</span>
      <div class="linkcard-body">
        <input class="linkcard-tag" type="text" placeholder="+ label this link" data-linktagkind="${kind}" data-linktagkey="${escapeAttr(key)}" data-linktagidx="${idx}" value="${escapeAttr(link.tag)}">
        <a href="${escapeAttr(link.url)}" target="_blank" rel="noopener">${escapeHtml(tvShortUrl(link.url))}</a>
      </div>
      <button class="rm" data-rmlinkkind="${kind}" data-rmlinkkey="${escapeAttr(key)}" data-rmlinkidx="${idx}">×</button>
    </div>`;
  }).join('')}</div>`;
}
function linkInputHTML(placeholder, kind, key){
  return `<div class="linkinput-row"><input type="text" placeholder="${placeholder}" data-linkkind="${kind}" data-linkkey="${escapeAttr(key)}"><button class="small">+ Add</button></div>`;
}

/* ---------------- entry index for sidebar ---------------- */
async function loadEntryIndex(){
  const keys = await sList('entry:');
  entryDateIndex = keys.map(k=>k.replace('entry:','')).sort().reverse();
}

async function loadRCacheForDates(dates){
  for(const d of dates){
    if(entryRCache[d] !== undefined) continue;
    const raw = await sGet('entry:'+d);
    if(!raw){ entryRCache[d] = null; continue; }
    try{
      const parsed = JSON.parse(raw);
      entryRCache[d] = computeTotalR(parsed.trades);
    }catch(e){ entryRCache[d] = null; }
  }
}

function renderEntryList(){
  const el = document.getElementById('entryListItems');
  if(entryDateIndex.length===0){ el.innerHTML = '<div class="empty" style="padding:8px 0;">no entries yet</div>'; return; }
  const visible = entryDateIndex.slice(0,30);
  el.innerHTML = visible.map(d=>{
    const active = d===currentDate ? 'active' : '';
    const r = entryRCache[d];
    const running = runningRCache[d];
    let dailyHtml = '';
    if(typeof r === 'number' && r !== 0){
      const cls = r > 0 ? 'r-pos' : 'r-neg';
      const sign = r > 0 ? '+' : '';
      dailyHtml = `<span class="entry-r ${cls}">${sign}${r.toFixed(1)}R</span>`;
    }
    let runningHtml = '';
    if(typeof running === 'number' && running !== 0){
      const cls = running > 0 ? 'r-pos' : 'r-neg';
      const sign = running > 0 ? '+' : '';
      runningHtml = `<span class="entry-r-running ${cls}">Σ${sign}${running.toFixed(1)}</span>`;
    }
    return `<div class="entryitem ${active}" data-date="${d}"><span>${fmtPretty(d)}</span><span class="entry-r-group">${runningHtml}${dailyHtml}</span></div>`;
  }).join('');
  el.querySelectorAll('.entryitem').forEach(it=>{
    it.addEventListener('click', ()=> gotoDate(it.dataset.date));
  });
  // Running totals need every prior day's R, not just what's visible — kick off a
  // full background fetch (cheap once cached) rather than only the visible slice.
  const uncached = entryDateIndex.filter(d=>entryRCache[d]===undefined);
  if(uncached.length){
    ensureAllRCached().then(()=> renderEntryList());
  } else if(Object.keys(runningRCache).length === 0){
    rebuildRunningRCache();
    renderEntryList();
  }
}

function renderTagList(){

}

function checklistBlockHTML(title, subtitle, defs, data, dataKey, models, clLinks, clTags){
  const cycleDefs = defs.filter(f=>!CHECK_ONLY_FIELDS.has(f.key));
  const checkDefs = defs.filter(f=>CHECK_ONLY_FIELDS.has(f.key));
  const udCountable = cycleDefs.filter(f=>!EXCLUDE_FROM_UD_COUNT.has(f.key));
  const uCount = udCountable.filter(f=>data[f.key]==='U'||data[f.key]==='E').length;
  const dCount = udCountable.filter(f=>data[f.key]==='D'||data[f.key]==='C').length;
  const nCount = udCountable.filter(f=>data[f.key]==='N').length;
  const checkedCount = checkDefs.filter(f=>data[f.key]==='X').length;
  // Whichever directional side (Up vs Down) has more votes among the cycling fields "wins" —
  // emphasize it so the overall lean is visible at a glance instead of doing the math yourself.
  const biasWinner = (uCount>0 || dCount>0) && uCount!==dCount ? (uCount>dCount ? 'U' : 'D') : null;
  const summary = (uCount||dCount||nCount||checkedCount)
    ? `${uCount?`<span class="cl-u-count${biasWinner==='U'?' cl-winning':''}">${uCount}U</span>`:''} ${dCount?`<span class="cl-d-count${biasWinner==='D'?' cl-winning':''}">${dCount}D</span>`:''} ${nCount?`<span class="cl-n-count">${nCount}N</span>`:''} ${checkedCount?`<span class="cl-chk-count">${checkedCount}✓</span>`:''}`
    : '';
  const biasBadge = biasWinner
    ? `<span class="cl-bias cl-bias-${biasWinner}">${biasWinner==='U' ? '▲ UP BIAS' : '▼ DOWN BIAS'}</span>`
    : '';

  function renderGrid(defsSubset){
    return `<div class="cl-grid">
      ${defsSubset.map(f=>{
        const v = data[f.key]||'';
        const isCheckOnly = CHECK_ONLY_FIELDS.has(f.key);
        const hasModel = models && MODEL_TAG_FIELDS.has(f.key);
        const hasTags = clTags && CHECKLIST_TAG_FIELDS.has(f.key);
        const modelVal = hasModel ? (models[f.key]||'') : '';
        const tagList = hasTags ? (clTags[f.key]||[]) : [];
        const itemClass = isCheckOnly ? (v==='X' ? (HIGHLIGHT_YELLOW_FIELDS.has(f.key) ? 'CHKY' : 'CHK') : '') : v;
        const badgeTxt = isCheckOnly ? (v==='X' ? '✓' : '·') : (v||'·');
        return `
        <div class="cl-item-wrap ${hasModel?'has-model':''} ${hasTags?'has-cltags':''}">
          <div class="cl-item ${itemClass}" data-clitemkey="${dataKey}" data-clfield="${f.key}" data-clcheckonly="${isCheckOnly?'1':'0'}">
            <span class="cl-badge">${badgeTxt}</span>
            <span class="cl-item-label">${f.label}</span>
          </div>
          ${hasModel ? `<input class="cl-model-input" type="text" placeholder="model tag" data-clmodelkey="${f.key}" value="${escapeAttr(modelVal)}">` : ''}
          ${hasTags ? `
            <div class="tagrow" style="margin-top:6px;">
              ${tagList.map(t=>`<span class="tag" data-cltagfield="${f.key}" data-tag="${escapeAttr(t)}">${escapeHtml(t)}<span class="x" data-rmcltag="${f.key}|${escapeAttr(t)}">×</span></span>`).join('')}
              <div class="tagadd"><input type="text" placeholder="+ tag" data-cltagfieldkey="${f.key}"></div>
            </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }

  const gridsHtml = checkDefs.length
    ? `
      <div class="cl-subgroup-label">Directional</div>
      ${renderGrid(cycleDefs)}
      <div class="cl-subgroup-label">Checks</div>
      ${renderGrid(checkDefs)}
    `
    : renderGrid(cycleDefs);

  return `
  <div class="cl-block" data-clkey="${dataKey}">
    <div class="cl-head">
      <div>
        <div class="cl-title">${title}</div>
        <div class="cl-sub">${subtitle}</div>
      </div>
      <div class="cl-summary">${biasBadge}${summary}</div>
    </div>
    ${gridsHtml}
  </div>`;
}

function findSection(key){ return currentEntry.sections[key]; }

function wireEntryEvents(){
  document.getElementById('dayNoteInput').addEventListener('input', e=>{
    currentEntry.dayNote = e.target.value; scheduleSave();
  });

  document.getElementById('exportBtn').addEventListener('click', exportDay);

  document.querySelectorAll('input[data-rfkey]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      currentEntry.redFlags[cb.dataset.rfkey] = cb.checked;
      renderEntry(); scheduleSave();
    });
  });

  document.querySelectorAll('input[data-dbupdate]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const sec = findSection(cb.dataset.dbupdatesec);
      if(!sec.dbUpdates) sec.dbUpdates = {};
      sec.dbUpdates[cb.dataset.dbupdate] = cb.checked;
      renderEntry(); scheduleSave();
    });
  });

  document.querySelectorAll('[data-clitemkey]').forEach(item=>{
    item.addEventListener('click', ()=>{
      const listKey  = item.dataset.clitemkey;
      const fieldKey = item.dataset.clfield;
      const cur      = currentEntry[listKey][fieldKey] || '';
      let next;
      if(item.dataset.clcheckonly === '1'){
        next = cur==='X' ? '' : 'X';
      } else if(fieldKey === 'odrsEndpoint'){
        next = cur==='' ? 'E' : cur==='E' ? 'C' : cur==='C' ? 'N' : '';
      } else {
        next = cur==='' ? 'U' : cur==='U' ? 'D' : cur==='D' ? 'N' : '';
      }
      currentEntry[listKey][fieldKey] = next;
      renderEntry(); scheduleSave();
    });
  });

function wireTagInput(inp, onCommit, scopeKey){
  inp.addEventListener('keydown', async e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const v = inp.value.trim();
      if(v){ await onCommit(v); inp.value=''; closeSuggest(); }
    }
  });
  inp.addEventListener('input', ()=>{
    const v = inp.value.trim().toLowerCase();
    closeSuggest();
    if(!v) return;
    const matches = allTags.filter(t=>t.toLowerCase().includes(v)).slice(0,8);
    if(matches.length===0) return;
    const box = document.createElement('div');
    box.className = 'tagsuggest';
    box.innerHTML = matches.map(m=>`<div data-pick="${m}">${m}</div>`).join('');
    inp.parentElement.appendChild(box);
    box.querySelectorAll('div').forEach(d=>{
      d.addEventListener('mousedown', async ev=>{
        ev.preventDefault();
        await onCommit(d.dataset.pick);
        inp.value=''; closeSuggest();
      });
    });
  });
  inp.addEventListener('blur', ()=> setTimeout(closeSuggest, 150));
}
function closeSuggest(){ document.querySelectorAll('.tagsuggest').forEach(b=>b.remove()); }

function linkToTag(item){
  const link = normLink(item);
  const label = link.tag ? `<span style="color:#e7e5e0;font-weight:600;">${escapeHtml(link.tag)}</span> — ` : '';
  return `<a href="${escapeAttr(link.url)}" target="_blank" style="color:#d2a44d;font-family:ui-monospace,Menlo,monospace;font-size:12px;display:block;padding:4px 0;">${label}${link.url.replace('https://www.tradingview.com/x/','TV/')}</a>`;
}

function hasContent(sec){
  const dbChecked = sec.dbUpdates && Object.values(sec.dbUpdates).some(v=>v);
  return (sec.live && sec.live.trim()) || (sec.review && sec.review.trim()) || sec.tags.length || (sec.links&&sec.links.length) || (sec.confluenceLink && sec.confluenceLink.trim()) || sec.selfScore || sec.reEngineeringScore || dbChecked;
}

    ${sec.review ? `<div class="xreview"><div class="xreview-label">Review</div>${escapeHtml(sec.review).replace(/\n/g,'<br>')}</div>` : ''}
    ${secKey==='eod' ? (checkedDbUpdates.length ? `<div class="xtags">${checkedDbUpdates.map(f=>`<span>✓ ${f.label}</span>`).join('')}</div>` : '') : (sec.tags.length ? `<div class="xtags">${sec.tags.map(t=>`<span>${t}</span>`).join('')}</div>` : '')}

          ${REVERSAL_FIELDS.map(k=>xChip(rfLabel(k), rf[k], '#e07b39')).join('')}
        </div>

  let clImgHtml = '';
  const clImgs = entry.boxChecklistLinks || {};
  for(const [fKey, urls] of Object.entries(clImgs)){
    if(!urls || !urls.length) continue;
    const linksHtml = urls.map(url=>linkToTag(url)).join('');
    if(linksHtml) clImgHtml += `<div style="margin-top:8px;"><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#d2a44d;margin-bottom:4px;">${fKey}</div>${linksHtml}</div>`;
  }

  body += exportChecklistBlock('0930–1030 Box Formation','Pre-market · Box Reversal', BOX_CHECKLIST_DEFS, entry.boxChecklist||{}, entry.boxChecklistModels||{}, clImgs, entry.boxChecklistTags||{});
  if(clImgHtml) body = body.replace('<div id="xcl-img-placeholder"></div>', clImgHtml);
  body += exportChecklistBlock('After 1030','RBC · M7X', POST1030_CHECKLIST_DEFS, entry.post1030Checklist||{}, null, null);
  for(const s of SECTION_DEFS){
    body += sectionExportBlock(s.label, entry.sections[s.key], s.key);
  }
  for(let i=0;i<entry.trades.length;i++){
    body += tradeExportBlock(entry.trades[i], i);
  }

  const candles = entry.candles || {};
  const activeCandleDefs = CANDLE_DEFS.filter(c=>{
    const d = candles[c.key];
    return d && (d.time || d.tag || (d.links && d.links.length));
  });
  if(activeCandleDefs.length){
    let candleCards = '';
    for(const c of activeCandleDefs){
      const d = candles[c.key];
      const imgHtml = (d.links||[]).map(linkToTag).join('');
      candleCards += `
      <div class="xcandlecard">
        <div class="xcandlecard-label">${c.label}</div>
        <div class="xcandlecard-meta">${d.time?`<span>${d.time}</span>`:''} ${d.tag?`<span style="color:#d2a44d">· ${escapeHtml(d.tag)}</span>`:''}</div>

    body += `

    </div>`;
  }

  if(!body){ body = '<div class="xempty">No content logged for this day.</div>'; }

  return `<!DOCTYPE html>

async function exportDay(){
  const btn = document.getElementById('exportBtn');
  btn.textContent = 'Building…'; btn.disabled = true;
  try{
    const html = await buildExportHTML(currentEntry);
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `journal-${currentEntry.date}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('exported — check downloads');
  }catch(e){
    toast('export failed');
  }
  btn.textContent = '⇩ Export Day'; btn.disabled = false;
}

/* ---------------- navigation ---------------- */
async function gotoDate(date){
  currentDate = date;
  document.getElementById('datePicker').value = date;
  currentEntry = await loadEntry(date);
  renderEntry();
  renderEntryList();
  setSaveState('idle');
}

function shiftDate(days){
  const d = new Date(currentDate+'T12:00:00');
  d.setDate(d.getDate()+days);
  gotoDate(d.toISOString().slice(0,10));
}

document.getElementById('prevDay').addEventListener('click', ()=>shiftDate(-1));
document.getElementById('nextDay').addEventListener('click', ()=>shiftDate(1));
document.getElementById('datePicker').addEventListener('change', e=> gotoDate(e.target.value));

// Delegated "+ Add" click handler for all TradingView link inputs across the whole
// entry view. This is attached exactly ONCE here (not inside wireEntryEvents/renderEntry)
// so it doesn't pile up duplicate handlers on every re-render.
document.getElementById('mainEntry').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const row = btn.closest('.linkinput-row');
  if(!row) return;
  const inp = row.querySelector('input[type=text]');
  if(!inp) return;
  const url = inp.value.trim();
  if(!url) return;
  const kind = inp.dataset.linkkind;
  const key  = inp.dataset.linkkey;
  function addTo(arrOwner){
    if(!arrOwner.links) arrOwner.links = [];
    const already = arrOwner.links.some(l => normLink(l).url === url);
    if(!already){ arrOwner.links.push({url, tag:''}); renderEntry(); scheduleSave(); }
  }
  if(kind === 'section'){
    const sec = findSection(key);
    if(sec) addTo(sec);
  } else if(kind === 'trade'){
    const t = findTrade(key);
    if(t) addTo(t);
  } else if(kind === 'candle'){
    if(currentEntry.candles[key]) addTo(currentEntry.candles[key]);
  }
});

/* ---------------- search mode ---------------- */
function switchMode(mode){
  const entryBtn = document.getElementById('modeEntry');
  const searchBtn = document.getElementById('modeSearch');
  const mainEntry = document.getElementById('mainEntry');
  const mainSearch = document.getElementById('mainSearch');
  const entryNav = document.getElementById('entryNavBlock');
  if(mode==='entry'){
    entryBtn.classList.add('active'); searchBtn.classList.remove('active');
    mainEntry.style.display='block'; mainSearch.style.display='none';
    entryNav.style.display='block';
  } else {
    entryBtn.classList.remove('active'); searchBtn.classList.add('active');
    mainEntry.style.display='none'; mainSearch.style.display='block';
    entryNav.style.display='none';
    renderSearchShell();
  }
}
document.getElementById('modeEntry').addEventListener('click', ()=>switchMode('entry'));
document.getElementById('modeSearch').addEventListener('click', ()=>switchMode('search'));

function renderSearchShell(){
  const main = document.getElementById('mainSearch');
  main.innerHTML = `
    <div class="daytitle"><h1>Search by Tag</h1></div>
    <div class="daysub">Pull every moment you reasoned about a setup, across every day.</div>
    <div class="searchbar">
      <input type="text" id="searchInput" placeholder="type a tag, e.g. Break_Rule_1030, DDR_partial_broken...">
    </div>
    <div id="searchResults"><div class="empty">start typing or click a tag on the left</div></div>
  `;
  document.getElementById('searchInput').addEventListener('input', e=> runSearch(e.target.value));
}

async function runSearch(query){
  const q = query.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  if(!q){ resultsEl.innerHTML = '<div class="empty">start typing or click a tag on the left</div>'; return; }
  resultsEl.innerHTML = '<div class="empty">searching…</div>';

  const keys = await sList('entry:');
  const results = [];
  const dates = keys.map(k=> k.startsWith('entry:') ? k.slice(6) : k);
  for(const date of dates){
    const raw = await sGet('entry:'+date);
    if(!raw) continue;
    let entry;
    try{ entry = JSON.parse(raw); }catch(e){ continue; }

    SECTION_DEFS.forEach(s=>{
      const sec = entry.sections[s.key];
      if(!sec) return;
      const tagMatch = sec.tags.some(t=>t.toLowerCase().includes(q));
      const textMatch = (sec.live||'').toLowerCase().includes(q) || (sec.review||'').toLowerCase().includes(q);
      if(tagMatch || textMatch){
        results.push({date, section:s.label, sectionKey:s.key, live:sec.live, review:sec.review, tags:sec.tags, tradeId:null});
      }
    });
    (entry.trades||[]).forEach(t=>{
      const tagMatch = (t.tags||[]).some(tg=>tg.toLowerCase().includes(q));
      const textMatch = (t.live||'').toLowerCase().includes(q) || (t.review||'').toLowerCase().includes(q) || (t.model||'').toLowerCase().includes(q);
      if(tagMatch || textMatch){
        results.push({date, section:`Trade · ${t.model||'untitled'} ${t.dir||''} ${t.r?('· '+t.r+'R'):''}`, sectionKey:'trades', live:t.live, review:t.review, tags:t.tags, tradeId:t.id});
      }
    });
  }

  results.sort((a,b)=> b.date.localeCompare(a.date));

  if(results.length===0){ resultsEl.innerHTML = '<div class="empty">no matches</div>'; return; }

  resultsEl.innerHTML = results.map(r=>`
    <div class="searchresult" data-jump="${r.date}">
      <div class="sr-top"><span class="sr-section">${r.section}</span><span>${fmtPretty(r.date)}</span></div>
      ${r.live ? `<div class="sr-snip live">${escapeHtml(snippet(r.live))}</div>` : ''}
      ${r.review ? `<div class="sr-snip">↳ review: ${escapeHtml(snippet(r.review))}</div>` : ''}
      <div class="sr-tags">${(r.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  resultsEl.querySelectorAll('.searchresult').forEach(card=>{
    card.addEventListener('click', ()=>{
      switchMode('entry');
      gotoDate(card.dataset.jump);
    });
  });
}

async function backupData(){
  const btn = document.getElementById('backupBtn');
  btn.textContent = 'Scanning…'; btn.disabled = true;
  try{
    const backup = { version:1, created: new Date().toISOString(), entries:{}, images:{} };
    const entryKeys = await sList('entry:');
    for(const key of entryKeys){
      const val = await sGet(key.startsWith('entry:') ? key : 'entry:'+key);
      if(val) backup.entries[key] = val;
    }
    const imgKeys = await sList('img:');
    for(const key of imgKeys){
      const val = await sGet(key);
      if(val) backup.images[key] = val;
    }
    const tags = await sGet('tags:master');
    if(tags) backup.tags = tags;

    const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `sequence-journal-backup-${date}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    const entryCount = Object.keys(backup.entries).length;
    const imgCount   = Object.keys(backup.images).length;
    toast(`backed up ${entryCount} entries + ${imgCount} images`);
  }catch(e){
    console.error(e); toast('backup failed');
  }
  btn.textContent = '⇩ Backup'; btn.disabled = false;
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// Retry-aware set: tries up to 4 times with backoff before giving up on a key
async function sSetSafe(key, value, shared=false){
  let lastErr = null;
  for(let attempt=0; attempt<4; attempt++){
    try{
      const r = await window.storage.set(key, value, shared);
      if(r) return true;
      lastErr = new Error('empty response');
    }catch(e){ lastErr = e; }
    await sleep(300 * (attempt+1)); // 300ms, 600ms, 900ms, 1200ms backoff
  }
  console.error(`storage set failed for ${key} after retries:`, lastErr);
  return false;
}

async function restoreData(file){
  if(!file) return;
  if(!confirm(`Restore from ${file.name}? This will merge with existing data — nothing will be deleted.`)) return;

  const btn = document.getElementById('restoreLabel');
  const originalLabel = btn.innerHTML;

  let text, backup;
  try{
    text = await file.text();
    backup = JSON.parse(text);
  }catch(e){
    console.error(e); toast('restore failed — invalid backup file'); return;
  }

  const entryPairs = Object.entries(backup.entries||{});
  const imagePairs = Object.entries(backup.images||{});
  const total = entryPairs.length + imagePairs.length + (backup.tags ? 1 : 0);
  let done = 0, okCount = 0, failedKeys = [];

  function setProgress(){
    btn.textContent = `⇪ Restoring ${done}/${total}…`;
  }
  setProgress();

  // Write entries first (small, fast), then images (larger), each throttled
  // so we don't fire dozens of requests in the same instant.
  for(const [key, val] of entryPairs){
    const ok = await sSetSafe(key, val);
    if(ok) okCount++; else failedKeys.push(key);
    done++; setProgress();
    await sleep(80);
  }
  for(const [key, val] of imagePairs){
    const ok = await sSetSafe(key, val);
    if(ok) okCount++; else failedKeys.push(key);
    done++; setProgress();
    await sleep(80);
  }
  if(backup.tags){
    const ok = await sSetSafe('tags:master', backup.tags);
    if(ok) okCount++; else failedKeys.push('tags:master');
    done++; setProgress();
  }

  btn.innerHTML = originalLabel;

  entryRCache = {};
  runningRCache = {};
  await loadTags(); renderTagList();
  await loadEntryIndex(); renderEntryList();
  await gotoDate(currentDate);

  if(failedKeys.length === 0){
    toast(`restored ${entryPairs.length} entries + ${imagePairs.length} images`);
  } else if(okCount > 0){
    toast(`restored ${okCount}/${total} — ${failedKeys.length} failed, retry restore to fill gaps`);
    console.warn('Keys that failed to restore:', failedKeys);
  } else {
    toast('restore failed — storage service unavailable, try again shortly');
  }
}

async function cleanStorage(){
  const btn = document.getElementById('cleanStorageBtn');
  btn.textContent = 'Scanning…'; btn.disabled = true;
  try{
    const entryKeys = await sList('entry:');
    const referencedImgs = new Set();
    for(const key of entryKeys){
      const raw = await sGet(key.startsWith('entry:') ? key : 'entry:'+key);
      if(!raw) continue;
      try{
        const entry = JSON.parse(raw);
        Object.values(entry.sections||{}).forEach(s=>(s.images||[]).forEach(k=>referencedImgs.add(k)));
        (entry.trades||[]).forEach(t=>(t.images||[]).forEach(k=>referencedImgs.add(k)));
        Object.values(entry.candles||{}).forEach(c=>(c.images||[]).forEach(k=>referencedImgs.add(k)));
        Object.values(entry.chartLevels||{}).forEach(c=>(c.images||[]).forEach(k=>referencedImgs.add(k))); // legacy, harmless if absent
        Object.values(entry.boxChecklistImages||{}).forEach(arr=>(arr||[]).forEach(k=>referencedImgs.add(k)));
      }catch(e){}
    }
    const allImgKeys = await sList('img:');
    const orphans = allImgKeys.filter(k=> !referencedImgs.has(k));
    if(orphans.length === 0){
      toast('storage is clean — no orphans found');
      btn.textContent = '🗑 Clean Storage'; btn.disabled = false;
      return;
    }
    let deleted = 0;
    for(const k of orphans){ await sDel(k); deleted++; }
    toast(`freed ${deleted} orphaned image${deleted>1?'s':''}`);
  }catch(e){
    console.error('clean storage error:', e);
    toast('clean storage failed');
  }
  btn.textContent = '🗑 Clean Storage'; btn.disabled = false;
}

/* ---------------- init ---------------- */
async function init(){
  await loadTags();
  renderTagList();
  await loadEntryIndex();
  if(entryDateIndex.length){ currentDate = entryDateIndex[0]; }
  await gotoDate(currentDate);
  document.getElementById('cleanStorageBtn').addEventListener('click', cleanStorage);
  document.getElementById('backupBtn').addEventListener('click', backupData);
  document.getElementById('restoreInput').addEventListener('change', e=> restoreData(e.target.files[0]));
}
init();
